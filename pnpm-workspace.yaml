packages:
  # all packages in direct subdirs of packages/
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
minimumReleaseAgeExclude:
  - '@ai-zen/async-queue@1.4.0'
onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
overrides:
  '@hono/node-server': ^2.0.5
  brace-expansion: ^5.0.9
  fast-uri: ^4.1.2
  hono: ^4.12.34
  ip-address: ^10.4.0
  nanoid: ^3.3.18
  postcss: ^8.5.23
