packages:
  # all packages in direct subdirs of packages/
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
minimumReleaseAgeExclude:
  - '@ai-zen/async-queue@1.4.0 || 1.5.0 || 1.6.0 || 1.7.0-alpha.0'
  - '@vitest/mocker@5.1.0'
  - '@vitest/spy@5.1.0'
  - vitest@5.1.0
onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
overrides:
  '@hono/node-server': ^2.0.5
  brace-expansion: ^5.0.12
  fast-uri: ^4.1.2
  hono: ^4.12.34
  ip-address: ^10.4.0
  nanoid: ^3.3.18
  postcss: ^8.5.23
  source-map-js: ^1.2.2
